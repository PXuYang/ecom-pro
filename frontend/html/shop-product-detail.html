<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Detail | Ecom Pro</title>
</head>
<body>

<main class="productDetail">

    <section class="productMain">

        <div class="productImageSection">
            <img id="productImage" src="" alt="">
        </div>

        <div class="productPurchaseSection">
            <p id="productBrand" class="productBrand"></p>
            <h1 id="productName"></h1>
            <p id="productPrice" class="productPrice"></p>
            <p id="productDescription" class="productDescription"></p>

            <label for="productQuantity">Quantity</label>

            <div class="quantitySelector">
                <button type="button" id="decreaseButton">−</button>
                <input id="productQuantity" type="number" value="1" min="1">
                <button type="button" id="increaseButton">+</button>
            </div>

            <button type="button" id="addToCartButton" class="addToCartButton">
                Add to Cart
            </button>

            <button type="button" id="buyNowButton" class="buyNowButton">
                Buy Now
            </button>
        </div>
    </section>

    <section class="productInformation">
        <button type="button" class="productInfoToggle">
            Product Information
            <span class="toggleIcon">+</span>
        </button>
        <div class="productInfoContent">

        </div>
    </section>

    <section class="productReturnPolicy">
        <button type="button" class="productReturnToggle">
            Return Policy
            <span class="toggleIcon">+</span>
        </button>
        <div class="pruductReturnContent">

        </div>
    </section>
</main>

</body>
</html>
