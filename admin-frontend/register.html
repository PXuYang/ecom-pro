<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ecom Pro Register</title>

    <link rel="stylesheet" href="loginRegisterStyle.css">
</head>
<body>
    <h1>Ecom Pro</h1>

    <form id="registerForm">
        <h2>Create account</h2>
        <label for="registerUsernameInput">username:</label>
        <input id="registerUsernameInput" type="text">
        <span id="registerUsernameError" class="fieldError"></span>

        <label for="registerPasswordInput">password:</label>
        <input id="registerPasswordInput" type="password">
        <span id="registerPasswordError" class="fieldError"></span>

        <div class="passwordRequirements">
            <p>Password must contain:</p>
            <ul>
                <li id="lengthRequirement">At least 8 characters</li>
                <li id="lowercaseRequirement">One lowercase letter</li>
                <li id="uppercaseRequirement">One uppercase letter</li>
                <li id="specialRequirement">One special character</li>
                <li id="numberRequirement">One number</li>
            </ul>
        </div>

        <button type="submit">Create Account</button>
    </form>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

    <script src="register.js"></script>
</body>
</html>
