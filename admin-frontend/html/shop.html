<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ecom Shop</title>

    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/shop.css">
    <link rel="stylesheet" href="../css/socialLink.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

<nav class="shopNavbar">
    <div class="shopLogo">Ecom Pro</div>

    <div class="shopSearch">
      <input id="productSearchInput" type="text" placeholder="Search products...">
      <button id="searchButton">Search</button>
    </div>

    <div class="shopNavActions">

        <div class="socialLinks">
            <a href="https://www.linkedin.com/in/xuyang-sean-pang"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="LinkedIn">
                <i class="fa fa-linkedin-square"></i>
            </a>

            <a href="https://www.instagram.com/sssyuy_/"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Instagram">
                <i class="fa fa-instagram"></i>
            </a>

        </div>

        <a href="#" id="cartLink">🛒 Cart</a>

        <div class="accountMenu">
            <div class="accountButton">
                👤
                <span id="usernameDisplay"></span>
                <span class="dropdownArrow">▼</span>
            </div>

            <div class="accountDropdown">
                <a href="#" id="profileLink">Profile</a>
                <a href="#" id="changePasswordLink">Change Password</a>
                <a href="../html/admin.html" id="adminDashboardLink">Admin Dashboard</a>
                <a href="#" id="logoutLink">Log Out</a>
            </div>
        </div>
  </div>

</nav>

    <script src="../js/auth.js"></script>
    <script src="../js/shop.js"></script>
</body>
</html>
