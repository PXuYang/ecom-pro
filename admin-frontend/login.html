<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ecom Pro Login</title>

    <link rel="stylesheet" href="loginRegisterStyle.css">
</head>
<body>
    <h1>Ecom Pro</h1>

    <form id="loginForm">
        <h2>Login to your account</h2>
        <label for="loginUsernameInput">username:</label>
        <input id="loginUsernameInput" type="text">
        <span id="loginUsernameError" class="fieldError"></span>

        <label for="loginPasswordInput">password:</label>
        <input id="loginPasswordInput" type="password">
        <label class="showPassword">
            <input type="checkbox" data-toggle-target="loginPasswordInput">Show Password
        </label>
        <span id="loginPasswordError" class="fieldError"></span>

        <button type="submit">Login</button>
    </form>

    <p>
        Don't have an account yet?
        <a href="register.html">Register</a>
    </p>

    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
